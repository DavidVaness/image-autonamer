<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="90" y="105" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">04  HUMAN CONTROL WHEN YOU WANT IT</text>
  <text x="90" y="169" fill="#fff" font-family="-apple-system, sans-serif" font-size="44" font-weight="700">Review. Edit. Approve. Undo.</text>
  <g transform="translate(90 265)">
