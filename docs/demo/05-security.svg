    <circle cx="115" cy="67" r="34" fill="#7c3aed"/><path d="M98 67h34M115 50v34" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="115" y="137" text-anchor="middle" fill="#fff" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Review</text>
    <text x="115" y="170" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="17">See the evidence</text>
    <path d="M250 105h70" stroke="#475569" stroke-width="4"/>
    <rect x="340" width="230" height="210" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
