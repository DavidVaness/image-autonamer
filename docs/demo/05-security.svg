    <text x="455" y="137" text-anchor="middle" fill="#fff" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Edit</text>
    <text x="455" y="170" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="17">Keep final say</text>
    <path d="M590 105h70" stroke="#475569" stroke-width="4"/>
    <rect x="680" width="230" height="210" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="795" cy="67" r="34" fill="#22c55e"/><path d="m778 67 12 12 23-28" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="795" y="137" text-anchor="middle" fill="#fff" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Approve</text>
    <text x="795" y="170" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="17">Safe rename</text>
    <path d="M930 105h70" stroke="#475569" stroke-width="4"/>
