name: Bug report
description: Report reproducible incorrect behavior or a crash.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Image Autonamer more reliable.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I am using the latest release.
          required: true
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private filenames and image contents from logs or screenshots.
          required: true
  - type: input
    attributes:
      label: Image Autonamer version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 15.6, Apple M2
    validations:
      required: true
  - type: input
    attributes:
      label: Ollama and model version
      placeholder: Ollama 0.x, qwen3-vl:4b
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Launch Image Autonamer.
        2. Add an image to Downloads.
        3. Wait for the next scan.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant activity or logs
      description: Paste only sanitized output that does not reveal private filenames or image contents.
      render: text
