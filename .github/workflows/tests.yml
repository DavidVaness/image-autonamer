name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m py_compile eval/run.py scripts/build-brand-assets.py
      - run: python -m json.tool eval/manifest.json >/dev/null

  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh -n scripts/*.sh bin/image-autonamer
      - run: swift test
      - run: ./scripts/package-release.sh 0.5.0
      - run: codesign --verify --deep --strict --verbose=2 "dist/Image Autonamer.app"
      - run: test -f "dist/Image Autonamer.app/Contents/Resources/AppIcon.icns"
      - run: unzip -t "dist/Image-Autonamer-macOS-$(uname -m).zip"
